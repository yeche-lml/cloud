<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>管理面板 — FOR YOU</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans SC',-apple-system,sans-serif;
  background:#0a0a0a;
  color:#e0e0e0;
  line-height:1.5;
  min-height:100vh;
}
.wrapper{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:1.2rem;border-bottom:2px solid #333;
  margin-bottom:2rem;
}
.header h1{font-size:1.6rem;color:#ff6b9d;font-weight:900}
.header .badge{font-size:0.8rem;background:#ff6b9d;color:#000;padding:0.25em 0.8em;border-radius:4px;font-weight:700}
.log-section{margin-bottom:2.5rem}
.log-section h2{font-size:1.2rem;color:#ffd700;margin-bottom:1rem;font-weight:700}
.log-section h2 small{color:#888;font-size:0.7em;font-weight:400;margin-left:0.5em}
table{width:100%;border-collapse:collapse;background:#1a1a1a;border-radius:8px;overflow:hidden}
th{background:#2a2a2a;color:#ccc;font-weight:700;padding:0.7rem 0.8rem;font-size:0.85rem;text-align:left;text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid #333}
td{padding:0.65rem 0.8rem;font-size:0.88rem;border-bottom:1px solid #222;vertical-align:top}
tr:hover td{background:#252525}
td.ip{font-family:monospace;color:#66d9ef}
td.loc{color:#a6e22e}
td.time{color:#aaa;font-size:0.82rem;white-space:nowrap}
td.count{color:#ffd700;font-weight:700;text-align:center}
td.highlight{color:#ff6b9d;font-weight:700;text-align:center;font-size:1.1rem}
.no-data{padding:2rem;text-align:center;color:#666;font-size:0.9rem}
.refresh-bar{display:flex;justify-content:flex-end;margin-bottom:1rem}
.refresh-btn{background:#ff6b9d;color:#000;border:none;padding:0.5em 1.5em;font-size:0.85rem;border-radius:4px;cursor:pointer;font-weight:700}
.refresh-btn:hover{background:#ff85b0}
.error{background:#331111;color:#ff4444;padding:1rem;border-radius:6px;margin-bottom:1rem;font-size:0.9rem}
.loading{text-align:center;padding:3rem;color:#666}
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#1a1a1a;border:2px solid #333;border-radius:8px;padding:2rem 2.5rem;text-align:center;max-width:380px;width:90%}
.login-box h2{color:#ff6b9d;font-size:1.3rem;margin-bottom:0.3em}
.login-box p{color:#888;font-size:0.85rem;margin-bottom:1.5rem}
.login-box input{width:100%;padding:0.7em 1em;border:2px solid #333;border-radius:4px;background:#0a0a0a;color:#fff;font-size:1rem;margin-bottom:1rem;text-align:center;outline:none}
.login-box input:focus{border-color:#ff6b9d}
.login-box button{width:100%;padding:0.7em;background:#ff6b9d;color:#000;border:none;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer}
.login-box button:hover{background:#ff85b0}
.login-error{color:#ff4444;font-size:0.8rem;margin-top:0.5rem;display:none}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
.card{background:#1a1a1a;border:2px solid #333;border-radius:8px;padding:1.2rem 1.5rem}
.card.yes-card{border-color:#ff6b9d}
.card .num{font-size:2rem;font-weight:900;color:#ffd700}
.card.yes-card .num{color:#ff6b9d;font-size:2.5rem}
.card .label{font-size:0.8rem;color:#888;margin-top:0.2em}
@media(max-width:640px){
  .wrapper{padding:1rem}
  th,td{padding:0.5rem;font-size:0.78rem}
}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>管理面板</h2>
    <p>输入密码以查看访问数据</p>
    <input type="password" id="pwdInput" placeholder="密码" autofocus>
    <button onclick="checkPassword()">解锁</button>
    <div class="login-error" id="loginError">密码错误</div>
  </div>
</div>

<div class="wrapper" id="mainContent" style="display:none">
  <div class="header">
    <h1>管理面板</h1>
    <span class="badge" id="lastRefresh"></span>
  </div>

  <div class="refresh-bar">
    <button class="refresh-btn" onclick="loadData()">刷新数据</button>
  </div>

  <div id="errorArea"></div>

  <div class="summary-cards" id="summaryCards"></div>

  <div class="log-section">
    <h2>谁点了 YES <small>按 IP 统计，全部历史</small></h2>
    <div id="yesSummary"></div>
  </div>

  <div class="log-section">
    <h2>YES 点击明细 <small>每次点击记录，全部历史</small></h2>
    <div id="yesTable"></div>
  </div>

  <div class="log-section">
    <h2>访问记录 <small>全部历史</small></h2>
    <div id="visitTable"></div>
  </div>
</div>

<script>
var LOG_API = 'https://jsonblob.com/api/jsonBlob/019fa12d-26c2-75bf-8b24-052c78eb0112';
var PASSWORD = 'cloud2026';

document.getElementById('pwdInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') checkPassword();
});

function checkPassword(){
  var input = document.getElementById('pwdInput').value;
  if (input === PASSWORD) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = '';
    loadData();
  } else {
    document.getElementById('loginError').style.display = '';
    document.getElementById('pwdInput').value = '';
  }
}

function showError(msg){
  document.getElementById('errorArea').innerHTML = '<div class="error">' + msg + '</div>';
}

function loadData(){
  document.getElementById('errorArea').innerHTML = '';
  document.getElementById('yesSummary').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('yesTable').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('visitTable').innerHTML = '<div class="loading">加载中...</div>';

  fetch(LOG_API, { cache: 'no-store' })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var visits = data.visits || [];
    var yesClicks = data.yesClicks || [];

    // ---- 计算统计 ----
    var uniqueIPs = {};
    visits.forEach(function(v){ uniqueIPs[v.ip] = true; });

    // 按 IP 聚合 YES 点击
    var yesByIP = {};
    yesClicks.forEach(function(y){
      var key = y.ip;
      if (!yesByIP[key]) {
        yesByIP[key] = { ip: y.ip, city: y.city || '未知', region: y.region || '', country: y.country || '', count: 0, firstTime: y.time, lastTime: y.time };
      }
      yesByIP[key].count++;
      if (y.time < yesByIP[key].firstTime) yesByIP[key].firstTime = y.time;
      if (y.time > yesByIP[key].lastTime) yesByIP[key].lastTime = y.time;
    });

    var yesPeople = Object.values(yesByIP).sort(function(a,b){ return b.count - a.count; });
    var totalYES = yesClicks.length;

    // ---- 汇总卡片 ----
    document.getElementById('summaryCards').innerHTML =
      '<div class="card"><div class="num">' + visits.length + '</div><div class="label">总访问次数</div></div>' +
      '<div class="card"><div class="num">' + Object.keys(uniqueIPs).length + '</div><div class="label">独立访客 IP</div></div>' +
      '<div class="card yes-card"><div class="num">' + totalYES + '</div><div class="label">YES 总点击次数</div></div>' +
      '<div class="card"><div class="num">' + yesPeople.length + '</div><div class="label">点过 YES 的人数</div></div>';

    // ---- YES 按人统计 ----
    var ysHtml = '';
    if (yesPeople.length === 0) {
      ysHtml = '<div class="no-data">暂无 YES 点击记录</div>';
    } else {
      ysHtml = '<table><thead><tr><th>#</th><th>IP</th><th>城市</th><th>地区</th><th>点击次数</th><th>首次点击</th><th>最近点击</th></tr></thead><tbody>';
      for (var pi = 0; pi < yesPeople.length; pi++) {
        var p = yesPeople[pi];
        ysHtml += '<tr>' +
          '<td>' + (pi + 1) + '</td>' +
          '<td class="ip">' + p.ip + '</td>' +
          '<td class="loc">' + p.city + '</td>' +
          '<td>' + p.region + (p.country && p.country !== '未知' ? ', ' + p.country : '') + '</td>' +
          '<td class="highlight">' + p.count + '</td>' +
          '<td class="time">' + p.firstTime + '</td>' +
          '<td class="time">' + p.lastTime + '</td>' +
          '</tr>';
      }
      ysHtml += '</tbody></table>';
    }
    document.getElementById('yesSummary').innerHTML = ysHtml;

    // ---- YES 明细表 ----
    var yHtml = '';
    if (yesClicks.length === 0) {
      yHtml = '<div class="no-data">暂无 YES 点击记录</div>';
    } else {
      yHtml = '<table><thead><tr><th>#</th><th>IP</th><th>城市</th><th>时间</th></tr></thead><tbody>';
      for (var j = yesClicks.length - 1; j >= 0; j--) {
        var y = yesClicks[j];
        yHtml += '<tr>' +
          '<td>' + y.id + '</td>' +
          '<td class="ip">' + y.ip + '</td>' +
          '<td class="loc">' + y.city + '</td>' +
          '<td class="time">' + y.time + '</td>' +
          '</tr>';
      }
      yHtml += '</tbody></table>';
    }
    document.getElementById('yesTable').innerHTML = yHtml;

    // ---- 访问记录 ----
    var vHtml = '';
    if (visits.length === 0) {
      vHtml = '<div class="no-data">暂无访问记录</div>';
    } else {
      vHtml = '<table><thead><tr><th>#</th><th>IP</th><th>城市</th><th>地区</th><th>时间</th><th>UA</th></tr></thead><tbody>';
      for (var i = visits.length - 1; i >= 0; i--) {
        var v = visits[i];
        vHtml += '<tr>' +
          '<td>' + v.id + '</td>' +
          '<td class="ip">' + v.ip + '</td>' +
          '<td class="loc">' + v.city + '</td>' +
          '<td>' + v.region + ', ' + v.country + '</td>' +
          '<td class="time">' + v.time + '</td>' +
          '<td style="font-size:0.75rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + (v.userAgent||'') + '">' + (v.userAgent||'').substring(0,40) + '</td>' +
          '</tr>';
      }
      vHtml += '</tbody></table>';
    }
    document.getElementById('visitTable').innerHTML = vHtml;

    var now = new Date();
    document.getElementById('lastRefresh').textContent = '更新于 ' + now.toLocaleTimeString('zh-CN');
  })
  .catch(function(e){
    document.getElementById('yesSummary').innerHTML = '';
    document.getElementById('yesTable').innerHTML = '';
    document.getElementById('visitTable').innerHTML = '';
    showError('加载失败：' + e.message + '。请检查网络连接。');
  });
}
</script>
</body>
</html>
