/* 密码层 */
#gate {

    letter-spacing: 6px;

}

    border: none;
    border-bottom: 1px solid #444;
    color: #ccc;
    font-size: 22px;
    text-align: center;
    padding: 10px 20px;
    outline: none;
    font-family: inherit;
    letter-spacing: 4px;
    width: 220px;
    transition: border-color 0.3s;
}
#gate input:focus {
    border-bottom-color: #888;
}
#gate .hint {
    color: #c0392b;
    font-size: 12px;
    margin-top: 14px;
    letter-spacing: 1px;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.2s;
}
#gate .hint.show { opacity: 1; }

/* 画布区 */
#container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
canvas {
    display: block;
    image-rendering: pixelated;
    border: 1px solid #1a1a1a;
}

/* 完成提示 */
#done-msg {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 12px;
    letter-spacing: 4px;
    opacity: 0;
    transition: opacity 1.2s 0.5s;
    pointer-events: none;
}
#done-msg.show { opacity: 1; }
</style>

const CORRECT_NAME = "罗洋";

// ============ Gate ============
const gate = document.getElementById("gate");
const input = document.getElementById("name-input");
const hint = document.getElementById("hint");
const doneMsg = document.getElementById("done-msg");

input.addEventListener("keydown", function(e) {
    if (e.key !== "Enter") return;
    const val = input.value.trim();
    if (val === CORRECT_NAME) {
        gate.classList.add("hidden");
        startMosaic();
    } else if (val === "") {
        hint.textContent = "Type something.";
        hint.classList.add("show");
        setTimeout(() => hint.classList.remove("show"), 1500);
    } else {
        hint.textContent = "Not her name.";
        hint.classList.add("show");
        setTimeout(() => hint.classList.remove("show"), 1500);
        input.value = "";
    }
});

// ============ Canvas Setup ============
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// 计算画布尺寸：让像素块尽量大但适配屏幕
const BLOCK_SIZE = Math.min(
    Math.floor((window.innerWidth * 0.85) / PIXEL_SIZE),
    Math.floor((window.innerHeight * 0.85) / PIXEL_SIZE),
    12
);
canvas.width = PIXEL_SIZE * BLOCK_SIZE;
canvas.height = PIXEL_SIZE * BLOCK_SIZE;

// 背景
ctx.fillStyle = "#0a0a0a";
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ============ 像素块状态 ============
const blocks = [];
const totalBlocks = PIXEL_SIZE * PIXEL_SIZE;

// 生成像素块列表 (grid x, grid y, targetX, targetY)
for (let gy = 0; gy < PIXEL_SIZE; gy++) {
    for (let gx = 0; gx < PIXEL_SIZE; gx++) {
        const [r, g, b] = PIXELS[gy][gx];
        // 跳过太暗的像素（几乎纯黑），让它们不参与动画，保持背景
        blocks.push({
            gx, gy,
            targetX: gx * BLOCK_SIZE,
            targetY: gy * BLOCK_SIZE,
            r, g, b,
            // 动画状态
            x: gx * BLOCK_SIZE,
            y: -BLOCK_SIZE * (20 + Math.random() * 80), // 起始高度分散
            vy: 0,
            landed: false,
            delay: Math.random() * 0.8, // 随机延迟 0~0.8秒
            bounceCount: 0,
            maxBounces: 1 + Math.floor(Math.random() * 3), // 1~3次弹跳
            bounceY: 0,
            bounceVy: 0,
            // 石头效果微旋转
            rotation: (Math.random() - 0.5) * 0.15,
            targetRotation: 0,
        });
    }
}

// 完全随机打乱下落顺序
for (let i = blocks.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
}

// 分配延迟：让每个block有不同的起始时间，制造不规则落石感
// 使用指数分布让大多数集中在前面，少数散布在后面
blocks.forEach(b => {
    const u = Math.random();
    b.delay = u < 0.7
        ? Math.random() * 1.0          // 70% 在0~1秒内
        : u < 0.95
            ? 1.0 + Math.random() * 1.5  // 25% 在1~2.5秒
            : 2.5 + Math.random() * 2.0; // 5% 在2.5~4.5秒
});

// ============ 物理参数 ============
const GRAVITY = 2800; // 像素/秒² 重力加速度
const BOUNCE_DAMPING = 0.35; // 弹跳衰减
const GROUND_FRICTION = 0.7; // 落地横向摩擦

let startTime = null;
let animId = null;
let allLanded = false;

function startMosaic() {
    startTime = performance.now() / 1000;
    requestAnimationFrame(loop);
}

// 绘制单个像素块（带3D石头效果）
function drawBlock(b) {
    const x = b.x + b.bounceY * 0.3;
    const y = b.y;
    const s = BLOCK_SIZE;
    const pad = Math.max(1, s * 0.08); // 间隙

    // 主色块
    ctx.fillStyle = `rgb(${b.r},${b.g},${b.b})`;
    ctx.fillRect(x + pad, y + pad, s - pad * 2, s - pad * 2);

    // 3D 石头效果：高光边（左/上）
    const hl = Math.round(Math.min(255, b.r * 1.3));
    const hlg = Math.round(Math.min(255, b.g * 1.3));
    const hlb = Math.round(Math.min(255, b.b * 1.3));
    ctx.fillStyle = `rgb(${hl},${hlg},${hlb})`;
    ctx.fillRect(x + pad, y + pad, s - pad * 2, Math.max(1, s * 0.12));
    ctx.fillRect(x + pad, y + pad, Math.max(1, s * 0.12), s - pad * 2);

    // 阴影边（右/下）
    const sl = Math.round(Math.max(0, b.r * 0.55));
    const slg = Math.round(Math.max(0, b.g * 0.55));
    const slb = Math.round(Math.max(0, b.b * 0.55));
    ctx.fillStyle = `rgb(${sl},${slg},${slb})`;
    ctx.fillRect(x + s - pad - Math.max(1, s * 0.12), y + pad, Math.max(1, s * 0.12), s - pad * 2);
    ctx.fillRect(x + pad, y + s - pad - Math.max(1, s * 0.12), s - pad * 2, Math.max(1, s * 0.12));
}

function loop(ts) {
    const now = ts / 1000;
    const elapsed = now - startTime;
    const dt = Math.min(0.05, 1 / 60); // 固定时间步长，避免大帧跳跃

    let anyAnimating = false;

    // 清屏
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const b of blocks) {
        if (elapsed < b.delay) {
            anyAnimating = true;
            continue;
        }

        if (b.landed) {
            // 已落地，只绘制
            drawBlock(b);
            continue;
        }

        anyAnimating = true;

        // 下落物理
        b.vy += GRAVITY * dt;
        b.y += b.vy * dt;

        // 检测落地
        if (b.y >= b.targetY) {
            if (b.bounceCount < b.maxBounces) {
                // 弹跳
                b.y = b.targetY;
                b.vy = -b.vy * BOUNCE_DAMPING;
                b.bounceCount++;
                // 微小横向偏移
                b.x += (Math.random() - 0.5) * BLOCK_SIZE * 0.15;
            } else {
                // 最终落地
                b.y = b.targetY;
                b.x = b.targetX;
                b.vy = 0;
                b.landed = true;
            }
        }

        drawBlock(b);
    }

    if (!anyAnimating && !allLanded) {
        allLanded = true;
        doneMsg.classList.add("show");
    }

    if (!allLanded || !allLanded) {
        animId = requestAnimationFrame(loop);
    }
}

// 窗口大小变化时重新计算
window.addEventListener("resize", () => {
    if (!gate.classList.contains("hidden")) return;
    // 简单重新加载
    location.reload();
});

// 初始绘制空画布
ctx.fillStyle = "#0a0a0a";
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
