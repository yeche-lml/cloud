<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花田 — FOR YOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:url('https://images.unsplash.com/photo-1490750967868-88aa4f44baee?w=1920&auto=format&fit=crop') center/cover fixed;
  font-family:'Noto Serif SC',serif;
  color:#fff;
  overflow-x:hidden;
}

body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,.55) 100%);
  z-index:0;
}

.hero{
  position:relative;z-index:1;text-align:center;padding:3rem 1.5rem 2rem;
}

.hero h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,8vw,5.5rem);
  letter-spacing:.06em;
  text-shadow:0 0 60px rgba(0,0,0,.5);
  line-height:1.1;
}

.hero .sub{
  margin-top:.5rem;
  font-size:clamp(.85rem,1.6vw,1.1rem);
  font-weight:300;
  opacity:.75;
  letter-spacing:.15em;
}

.flower-grid{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:1.2rem;
  max-width:900px;
  margin:0 auto;
  padding:0 1.5rem 3rem;
}

.flower-card{
  aspect-ratio:3/4;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  text-decoration:none;
  display:block;
}

.flower-card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}

.flower-card .bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:transform .6s ease;
}

.flower-card:hover .bg{transform:scale(1.08)}

.flower-card .overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.15) 50%,transparent 100%);
}

.flower-card .name{
  position:absolute;bottom:0;left:0;right:0;
  padding:1rem;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.3rem;
  letter-spacing:.06em;
  text-align:center;
  z-index:2;
}

.flower-card .en{
  display:block;
  font-size:.65rem;
  font-family:'Noto Serif SC',serif;
  font-weight:300;
  opacity:.6;
  letter-spacing:.1em;
  margin-top:2px;
}

.flower-card.rose .bg{background-image:url('https://images.unsplash.com/photo-1769876030089-b7314c5b51b0?w=600&auto=format&fit=crop')}
.flower-card.lavender .bg{background-image:url('https://images.unsplash.com/photo-1499002238440-d264edd596ec?w=600&auto=format&fit=crop')}
.flower-card.sunflower .bg{background-image:url('https://images.unsplash.com/photo-1470509037663-6036b7f50d06?w=600&auto=format&fit=crop')}
.flower-card.cherry .bg{background-image:url('https://images.unsplash.com/photo-1522383225653-ed111181a951?w=600&auto=format&fit=crop')}
.flower-card.hibiscus .bg{background-image:url('https://images.unsplash.com/photo-1596401057633-54a27fe6e69e?w=600&auto=format&fit=crop')}
.flower-card.maple .bg{background-image:url('https://images.unsplash.com/photo-1507783548227-544c3b8fc065?w=600&auto=format&fit=crop')}

.divider{
  position:relative;z-index:1;
  text-align:center;padding:1rem 1.5rem 2rem;
}
.divider span{
  font-size:.7rem;letter-spacing:.2em;opacity:.4;font-weight:300;
}

.mom-entry{
  position:relative;z-index:1;
  text-align:center;padding:0 1.5rem 4rem;
}
.mom-btn{
  display:inline-block;
  font-family:'Bebas Neue',sans-serif;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  padding:.8em 2.5em;
  font-size:.9rem;
  letter-spacing:.1em;
  border-radius:50px;
  text-decoration:none;
  transition:all .3s ease;
}
.mom-btn:hover{
  background:rgba(255,255,255,.15);
  border-color:rgba(255,255,255,.4);
  transform:translateY(-2px);
}

@media(max-width:500px){
  .flower-grid{grid-template-columns:repeat(2,1fr);gap:.8rem}
  .flower-card .name{font-size:1rem}
}
</style>
</head>
<body>

<div class="hero">
  <h1>FOR YOU</h1>
  <p class="sub">每一朵花，都是一次心动</p>
</div>

<div class="flower-grid">
  <a href="rose.html" class="flower-card rose">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">玫瑰<span class="en">ROSE</span></div>
  </a>
  <a href="lavender.html" class="flower-card lavender">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">薰衣草<span class="en">LAVENDER</span></div>
  </a>
  <a href="sunflower.html" class="flower-card sunflower">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">向日葵<span class="en">SUNFLOWER</span></div>
  </a>
  <a href="cherry.html" class="flower-card cherry">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">樱花<span class="en">SAKURA</span></div>
  </a>
  <a href="hibiscus.html" class="flower-card hibiscus">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">扶桑<span class="en">HIBISCUS</span></div>
  </a>
  <a href="maple.html" class="flower-card maple">
    <div class="bg"></div><div class="overlay"></div>
    <div class="name">枫叶<span class="en">MAPLE</span></div>
  </a>
</div>

<div class="divider"><span>— — —</span></div>

<div class="mom-entry">
  <a href="mom.html" class="mom-btn">云雨数智 · MOM 制造运营系统</a>
</div>

</body>
</html>
