<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆小工坊 - Perler Beads Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  :root {
    --bg: #fdf6f0;
    --surface: #fffaf5;
    --surface2: #fef0e4;
    --text: #4a3728;
    --text-dim: #8b7355;
    --accent: #e8836b;
    --accent2: #f4a460;
    --border: #e8d5c4;
    --shadow: 0 2px 12px rgba(139, 115, 85, 0.10);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size: 16px; }
  body {
    font-family: 'Noto Sans SC', 'Baloo 2', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 20% 30%, #fef0e4 0%, transparent 50%),
                      radial-gradient(circle at 75% 70%, #fff0f0 0%, transparent 40%);
  }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100;
  }
  .header .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #f4a460, #e8836b);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 2px 8px rgba(232,131,107,0.3);
  }
  .header h1 {
    font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.5rem;
    color: var(--text); letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 0.8rem; color: var(--text-dim); margin-left: 4px;
  }

  /* Layout */
  .main-container {
    display: flex; gap: 20px; padding: 20px 24px;
    max-width: 1400px; margin: 0 auto;
    height: calc(100vh - 100px);
  }
  @media (max-width: 1100px) {
    .main-container { flex-direction: column; height: auto; }
    .sidebar-right { max-height: 400px !important; }
  }

  /* Canvas Area */
  .canvas-panel {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; min-width: 0;
  }
  .canvas-wrapper {
    position: relative;
    border-radius: var(--radius);
    background: var(--surface);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; border-radius: 4px; cursor: crosshair;
    image-rendering: pixelated; }
  .canvas-info {
    font-size: 0.85rem; color: var(--text-dim);
    display: flex; gap: 20px;
  }
  .canvas-info span { font-weight: 600; color: var(--accent); }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    font-family: 'Noto Sans SC', sans-serif; font-weight: 500; font-size: 0.9rem;
    padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    transition: all var(--transition); white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface2); border-color: var(--accent2); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { background: #d4725c; }
  .btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .btn.danger { border-color: #e8836b; color: #e8836b; }
  .btn.danger:hover { background: #fff0ed; }

  /* Right Sidebar */
  .sidebar-right {
    width: 320px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; max-height: calc(100vh - 110px);
    padding-right: 4px;
  }
  .sidebar-right::-webkit-scrollbar { width: 6px; }
  .sidebar-right::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .panel {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .panel h3 {
    font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
    color: var(--text); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h3::before { content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }

  /* Color Palette */
  .color-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .color-swatch {
    width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer;
    border: 3px solid transparent; transition: all var(--transition);
    position: relative;
  }
  .color-swatch:hover { transform: scale(1.12); z-index: 2; }
  .color-swatch.selected { border-color: var(--text); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--text); }
  .color-swatch.empty-sw { border: 2px dashed var(--border); background: repeating-conic-gradient(#f0e0d0 0% 25%, transparent 0% 50%) 50% / 8px 8px; }

  /* Template Gallery */
  .template-search {
    width: 100%; padding: 8px 12px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface2);
    font-family: 'Noto Sans SC', sans-serif; font-size: 0.85rem;
    color: var(--text); outline: none; margin-bottom: 10px;
    transition: border-color var(--transition);
  }
  .template-search:focus { border-color: var(--accent2); }
  .template-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    max-height: 340px; overflow-y: auto;
  }
  .template-grid::-webkit-scrollbar { width: 4px; }
  .template-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .template-item {
    aspect-ratio: 1; border-radius: var(--radius-sm); cursor: pointer;
    border: 2px solid transparent; transition: all var(--transition);
    background: var(--surface2); position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .template-item:hover { border-color: var(--accent2); transform: scale(1.05); z-index: 2; }
  .template-item canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .template-label {
    position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem; background: rgba(74,55,40,0.75); color: #fff;
    padding: 1px 6px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  }
  .template-cat {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .template-cat-btn {
    font-size: 0.75rem; padding: 4px 12px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: all var(--transition);
  }
  .template-cat-btn:hover { border-color: var(--accent2); color: var(--text); }
  .template-cat-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  /* Grid size control */
  .grid-size-row { display: flex; gap: 8px; align-items: center; }
  .grid-size-row label { font-size: 0.85rem; color: var(--text-dim); }
  .grid-size-row select {
    padding: 4px 10px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface2);
    font-family: 'Noto Sans SC', sans-serif; font-size: 0.85rem; color: var(--text);
    outline: none;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 24px;
    border-radius: 999px; font-size: 0.9rem; z-index: 999;
    animation: toastIn 0.3s ease-out, toastOut 0.3s 1.5s ease-in forwards;
    pointer-events: none;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(12px); } }
  @keyframes toastOut { to { opacity:0; transform:translateX(-50%) translateY(-8px); } }

  /* Footer */
  .footer { text-align: center; padding: 12px; color: var(--text-dim); font-size: 0.75rem; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">🧩</div>
  <div>
    <h1>拼豆小工坊</h1>
    <span class="subtitle">Perler Beads Studio — 点击格子来拼豆吧！</span>
  </div>
</header>

<div class="main-container">

  <!-- Canvas Panel -->
  <div class="canvas-panel">
    <div class="grid-size-row">
      <label>画板尺寸</label>
      <select id="gridSizeSelect">
        <option value="16">16×16</option>
        <option value="20" selected>20×20</option>
        <option value="24">24×24</option>
        <option value="29">29×29（标准板）</option>
      </select>
      <label style="margin-left:12px">显示网格</label>
      <input type="checkbox" id="showGrid" checked style="accent-color:var(--accent);">
    </div>
    <div class="canvas-wrapper">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="canvas-info">
      已放置 <span id="beadCount">0</span> 颗豆子
      &nbsp;|&nbsp; 当前颜色 <span id="currentColorName">—</span>
    </div>
    <div class="toolbar">
      <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)">↩ 撤销</button>
      <button class="btn danger" id="clearBtn">🗑 清空画板</button>
      <button class="btn" id="eraserBtn">🧹 橡皮擦</button>
      <button class="btn" id="fillBtn">🪣 填充背景</button>
      <button class="btn primary" id="exportBtn">📷 导出PNG</button>
    </div>
  </div>

  <!-- Right Sidebar -->
  <div class="sidebar-right">
    <!-- Color Palette -->
    <div class="panel">
      <h3>调色板</h3>
      <div class="color-grid" id="colorPalette"></div>
    </div>

    <!-- Templates -->
    <div class="panel">
      <h3>图案模板</h3>
      <div class="template-cat">
        <button class="template-cat-btn active" data-cat="all">全部</button>
        <button class="template-cat-btn" data-cat="cat">🐱 猫猫</button>
        <button class="template-cat-btn" data-cat="cartoon">✨ 卡通</button>
        <button class="template-cat-btn" data-cat="food">🍔 美食</button>
        <button class="template-cat-btn" data-cat="animal">🐾 动物</button>
        <button class="template-cat-btn" data-cat="emoji">😀 表情</button>
        <button class="template-cat-btn" data-cat="object">⭐ 物件</button>
      </div>
      <input class="template-search" id="templateSearch" placeholder="搜索图案...">
      <div class="template-grid" id="templateGrid"></div>
    </div>
  </div>
</div>

<div class="footer">点击格子放置豆子 · 右键/橡皮擦移除 · Ctrl+Z 撤销 · 滚轮缩放</div>

<script>
// ==================== PERLER BEADS STUDIO ====================

// ---- Color Palette (Perler Beads standard colors) ----
const COLORS = [
  { name:'白色', hex:'#ffffff', code:'W' },
  { name:'奶油', hex:'#fff8e7', code:'C' },
  { name:'浅灰', hex:'#c8c8c8', code:'G' },
  { name:'深灰', hex:'#6b6b6b', code:'D' },
  { name:'黑色', hex:'#1a1a1a', code:'B' },
  { name:'红色', hex:'#e74c3c', code:'R' },
  { name:'粉色', hex:'#f8a5c2', code:'P' },
  { name:'玫红', hex:'#e84393', code:'M' },
  { name:'橙色', hex:'#f39c12', code:'O' },
  { name:'黄色', hex:'#f1c40f', code:'Y' },
  { name:'浅绿', hex:'#a8e6cf', code:'L' },
  { name:'绿色', hex:'#27ae60', code:'E' },
  { name:'深绿', hex:'#1e8449', code:'N' },
  { name:'浅蓝', hex:'#a8d8ea', code:'A' },
  { name:'蓝色', hex:'#3498db', code:'U' },
  { name:'深蓝', hex:'#2c3e80', code:'I' },
  { name:'紫色', hex:'#9b59b6', code:'V' },
  { name:'淡紫', hex:'#d5b8e8', code:'T' },
  { name:'棕色', hex:'#8b5e3c', code:'K' },
  { name:'肤色', hex:'#fdd9b5', code:'S' },
];

// ---- State ----
let gridSize = 20;
let cellPx = 28;
let grid = [];
let history = [];
let maxHistory = 50;
let selectedColor = 1; // 0 = empty
let selectedTool = 'pen'; // 'pen' | 'eraser'
let showGrid = true;
let currentCat = 'all';
let searchQuery = '';

// ---- Canvas ----
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function initGrid(size) {
  grid = Array.from({length:size}, ()=>Array(size).fill(0));
  history = [];
  updateCanvasSize();
}

function updateCanvasSize() {
  gridSize = parseInt(document.getElementById('gridSizeSelect').value);
  cellPx = gridSize <= 16 ? 36 : gridSize <= 20 ? 28 : gridSize <= 24 ? 24 : 20;
  const total = gridSize * cellPx;
  canvas.width = total; canvas.height = total;
  canvas.style.width = total+'px'; canvas.style.height = total+'px';
}

// ---- Drawing ----
function drawGrid() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // Draw beads
  for (let r=0; r<gridSize; r++) {
    for (let c=0; c<gridSize; c++) {
      const ci = grid[r][c];
      if (ci === 0) continue;
      const x = c*cellPx, y = r*cellPx;
      // Bead with 3D effect
      const col = COLORS[ci-1].hex;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect(x+1, y+1, cellPx-2, cellPx-2, cellPx*0.25);
      ctx.fill();
      // Highlight
      const grad = ctx.createRadialGradient(x+cellPx*0.3, y+cellPx*0.3, cellPx*0.05, x+cellPx*0.5, y+cellPx*0.5, cellPx*0.6);
      grad.addColorStop(0, 'rgba(255,255,255,0.5)');
      grad.addColorStop(1, 'rgba(0,0,0,0.08)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x+1, y+1, cellPx-2, cellPx-2, cellPx*0.25);
      ctx.fill();
      // Bottom shadow
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.beginPath();
      ctx.roundRect(x+1, y+cellPx*0.85, cellPx-2, cellPx*0.15, [0,0,cellPx*0.25,cellPx*0.25]);
      ctx.fill();
    }
  }

  // Grid lines
  if (showGrid) {
    ctx.strokeStyle = 'rgba(139,115,85,0.15)';
    ctx.lineWidth = 0.5;
    for (let i=0; i<=gridSize; i++) {
      const pos = i*cellPx;
      ctx.beginPath(); ctx.moveTo(pos,0); ctx.lineTo(pos,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,pos); ctx.lineTo(canvas.width,pos); ctx.stroke();
    }
  }

  // Hover highlight
  if (hoveredCell && selectedTool==='pen' && selectedColor>0) {
    const [hr, hc] = hoveredCell;
    ctx.fillStyle = COLORS[selectedColor-1].hex;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.roundRect(hc*cellPx+1, hr*cellPx+1, cellPx-2, cellPx-2, cellPx*0.25);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (hoveredCell && selectedTool==='eraser') {
    const [hr, hc] = hoveredCell;
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.roundRect(hc*cellPx+2, hr*cellPx+2, cellPx-4, cellPx-4, 4);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

let hoveredCell = null;

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const c = Math.floor(mx / cellPx);
  const r = Math.floor(my / cellPx);
  if (r>=0 && r<gridSize && c>=0 && c<gridSize) return [r,c];
  return null;
}

function pushHistory() {
  const snap = grid.map(r=>[...r]);
  history.push(snap);
  if (history.length > maxHistory) history.shift();
}

function placeBead(r, c) {
  if (grid[r][c] === selectedColor) return;
  pushHistory();
  grid[r][c] = selectedColor;
}

function eraseBead(r, c) {
  if (grid[r][c] === 0) return;
  pushHistory();
  grid[r][c] = 0;
}

function undo() {
  if (history.length === 0) return;
  grid = history.pop();
}

function countBeads() {
  let cnt=0; grid.forEach(r=>r.forEach(c=>{if(c>0)cnt++;}));
  return cnt;
}

// ---- Event Handlers ----
let mouseDown = false;

canvas.addEventListener('mousedown', e=>{
  if (e.button===2) { e.preventDefault(); selectedTool='eraser'; }
  mouseDown = true;
  const cell = getCell(e);
  if (!cell) return;
  if (selectedTool==='pen' && selectedColor>0) placeBead(cell[0],cell[1]);
  else if (selectedTool==='eraser') eraseBead(cell[0],cell[1]);
  updateUI();
});

canvas.addEventListener('mousemove', e=>{
  hoveredCell = getCell(e);
  if (mouseDown && hoveredCell) {
    if (selectedTool==='pen' && selectedColor>0) placeBead(hoveredCell[0],hoveredCell[1]);
    else if (selectedTool==='eraser') eraseBead(hoveredCell[0],hoveredCell[1]);
    updateUI();
  }
  drawGrid();
});

canvas.addEventListener('mouseup', ()=>{ mouseDown=false; });
canvas.addEventListener('mouseleave', ()=>{ mouseDown=false; hoveredCell=null; drawGrid(); });
canvas.addEventListener('contextmenu', e=>e.preventDefault());

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const sizes = [16,20,24,29];
  let idx = sizes.indexOf(gridSize);
  if (e.deltaY>0 && idx<3) idx++;
  else if (e.deltaY<0 && idx>0) idx--;
  if (idx !== sizes.indexOf(gridSize)) {
    document.getElementById('gridSizeSelect').value = sizes[idx];
    changeGridSize();
  }
}, {passive:false});

document.addEventListener('keydown', e=>{
  if (e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); updateUI(); }
});

// ---- UI Updates ----
function updateUI() {
  document.getElementById('beadCount').textContent = countBeads();
  document.getElementById('currentColorName').textContent = selectedTool==='eraser' ? '橡皮擦' : COLORS[selectedColor-1].name;
  drawGrid();
}

function changeGridSize() {
  const oldGrid = grid; const oldSize = gridSize;
  updateCanvasSize();
  const newGrid = Array.from({length:gridSize}, ()=>Array(gridSize).fill(0));
  const minR = Math.min(oldSize, gridSize), minC = Math.min(oldSize, gridSize);
  for (let r=0; r<minR; r++) for (let c=0; c<minC; c++) newGrid[r][c] = oldGrid[r][c];
  grid = newGrid; history = [];
  updateUI();
}

// ---- Tool Buttons ----
document.getElementById('undoBtn').onclick = ()=>{ undo(); updateUI(); };
document.getElementById('clearBtn').onclick = ()=>{
  if (countBeads()===0) return;
  if (confirm('确定要清空画板吗？此操作不可撤销。')) { pushHistory(); grid = Array.from({length:gridSize},()=>Array(gridSize).fill(0)); updateUI(); }
};
document.getElementById('eraserBtn').onclick = function(){
  selectedTool = selectedTool==='eraser'?'pen':'eraser';
  this.classList.toggle('active', selectedTool==='eraser');
  document.getElementById('fillBtn').classList.remove('active');
  updateUI();
};
document.getElementById('fillBtn').onclick = function(){
  if (selectedColor===0) return;
  pushHistory();
  for (let r=0; r<gridSize; r++) for (let c=0; c<gridSize; c++) grid[r][c]=selectedColor;
  updateUI();
};
document.getElementById('exportBtn').onclick = ()=>{
  // Create export canvas at higher resolution
  const expSize = gridSize * 32;
  const expCanvas = document.createElement('canvas');
  expCanvas.width = expSize; expCanvas.height = expSize;
  const expCtx = expCanvas.getContext('2d');
  const px = 32;
  expCtx.fillStyle = '#fffaf5'; expCtx.fillRect(0,0,expSize,expSize);
  for (let r=0; r<gridSize; r++) {
    for (let c=0; c<gridSize; c++) {
      const ci = grid[r][c]; if (ci===0) continue;
      expCtx.fillStyle = COLORS[ci-1].hex;
      expCtx.beginPath(); expCtx.roundRect(c*px+1, r*px+1, px-2, px-2, 8); expCtx.fill();
      const grad = expCtx.createRadialGradient(c*px+px*0.3, r*px+px*0.3, 1, c*px+px*0.5, r*px+px*0.5, px*0.6);
      grad.addColorStop(0,'rgba(255,255,255,0.45)'); grad.addColorStop(1,'rgba(0,0,0,0.06)');
      expCtx.fillStyle = grad; expCtx.beginPath(); expCtx.roundRect(c*px+1, r*px+1, px-2, px-2, 8); expCtx.fill();
    }
  }
  const link = document.createElement('a');
  link.download = '拼豆作品_'+new Date().toISOString().slice(0,10)+'.png';
  link.href = expCanvas.toDataURL('image/png');
  link.click();
  showToast('导出成功！');
};
document.getElementById('gridSizeSelect').onchange = changeGridSize;
document.getElementById('showGrid').onchange = function(){ showGrid=this.checked; updateUI(); };

// ---- Color Palette ----
function buildColorPalette() {
  const container = document.getElementById('colorPalette');
  container.innerHTML = '';
  COLORS.forEach((c, i)=>{
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (selectedColor===i+1 ? ' selected' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    sw.onclick = ()=>{
      selectedColor = i+1; selectedTool='pen';
      document.getElementById('eraserBtn').classList.remove('active');
      document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      updateUI();
    };
    container.appendChild(sw);
  });
  // Empty swatch
  const emptySw = document.createElement('div');

// ---- Build all templates ----
let allTemplates = [...TEMPLATES, ...MORE_CATS];

// ---- Template Rendering ----
function renderTemplate(canvas, template) {
  const size = 20;
  const px = Math.floor(canvas.width / size);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const rows = template.data.split('|');
  for (let r=0; r<size; r++) {
    const row = rows[r] || '';
    for (let c=0; c<Math.min(row.length, size); c++) {
      const ci = parseInt(row[c]);
      if (ci===0) continue;
      ctx.fillStyle = COLORS[ci-1]?.hex || '#ccc';
      ctx.fillRect(c*px, r*px, px, px);
    }
  }
}

function buildTemplateGallery() {
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '';
  const search = searchQuery.toLowerCase();
  const filtered = allTemplates.filter(t=>{
    if (currentCat!=='all' && t.cat!==currentCat) return false;
    if (search && !t.name.toLowerCase().includes(search)) return false;
    return true;
  });
  filtered.forEach(t=>{
    const item = document.createElement('div');
    item.className = 'template-item';
    item.title = t.name;
    const cvs = document.createElement('canvas');
    cvs.width = 80; cvs.height = 80;
    renderTemplate(cvs, t);
    item.appendChild(cvs);
    const label = document.createElement('span');
    label.className = 'template-label';
    label.textContent = t.name;
    item.appendChild(label);
    item.onclick = ()=>applyTemplate(t);
    grid.appendChild(item);
  });
}

function applyTemplate(tpl) {
  if (tpl.size !== gridSize) {
    document.getElementById('gridSizeSelect').value = tpl.size;
    changeGridSize();
  }
  pushHistory();
  const rows = tpl.data.split('|');
  for (let r=0; r<Math.min(gridSize, tpl.size); r++) {
    const row = rows[r] || '';
    for (let c=0; c<Math.min(row.length, gridSize); c++) {
      grid[r][c] = parseInt(row[c]) || 0;
    }
  }
  updateUI();
  showToast('已加载模板：'+tpl.name);
}

// ---- Template filters ----
document.querySelectorAll('.template-cat-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.template-cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    buildTemplateGallery();
  };
});

document.getElementById('templateSearch').oninput = function(){
  searchQuery = this.value;
  buildTemplateGallery();
};

// ---- Init ----
function init() {
  updateCanvasSize();
  initGrid(gridSize);
  buildColorPalette();
  buildTemplateGallery();
  updateUI();
}

init();

console.log('🧩 拼豆小工坊已就绪！共 ' + allTemplates.length + ' 个模板图案');
