<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>八年辗转 · 旧喜成真</title>
<style>
  @import url('https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: "Noto Serif SC", "PingFang SC", "STSong", "SimSun", serif;
    color: #3a3633;
    background: #1a1512;
    overflow-x: hidden;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .screen-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .screen-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(20, 15, 10, 0.4) 0%,
      rgba(20, 15, 10, 0.06) 35%,
      rgba(20, 15, 10, 0.03) 50%,
      rgba(20, 15, 10, 0.06) 65%,
      rgba(20, 15, 10, 0.4) 100%
    );
    pointer-events: none;
  }

  .screen-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  .screen-hero .title {
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1.3;
    animation: fadeUp 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .screen-year .year-num {
    font-size: clamp(6rem, 15vw, 13rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1;
  }

  .screen-final .final-text {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1.5;
  }

  .screen-final .final-name {
    display: block;
    margin-top: 1.5rem;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: rgba(250, 247, 243, 0.75);
    text-shadow: 0 1px 20px rgba(0,0,0,0.2);
  }

  .scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeInHint 2s 2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }

  @keyframes fadeInHint {
    from { opacity: 0; }
    to   { opacity: 0.55; }
  }

  .scroll-hint span {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(250,247,243,0.6);
  }

  .scroll-line {
    width: 1px;
    height: 3rem;
    background: linear-gradient(to bottom, rgba(250,247,243,0.5), rgba(250,247,243,0));
  }

  @media (max-width: 640px) {
    .screen-hero .title { letter-spacing: 0.1em; }
    .screen-year .year-num { font-size: clamp(4rem, 25vw, 10rem); }
    .screen-final .final-text { letter-spacing: 0.08em; }
    .scroll-hint { bottom: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen-hero .title, .scroll-hint { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<section class="screen screen-hero">
  <div class="screen-bg">
    <img src="img/01-lily_clean.jpg" alt="">
  </div>
  <div class="screen-content">
    <h1 class="title">八年辗转</h1>
  </div>
  <div class="scroll-hint">
    <span>向下</span>
    <div class="scroll-line"></div>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/02-platycodon_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2019</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/03-jasmine_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2020</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/04-sunflower_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2021</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/05-gardenia_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2022</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/06-white-rose_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2023</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/07-gypsophila_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2024</p>
  </div>
</section>

<section class="screen screen-year">
  <div class="screen-bg">
    <img src="img/08-lavender_clean.jpg" alt="" loading="lazy">
  </div>
  <div class="screen-content">
    <p class="year-num">2025</p>
  </div>
</section>

<section class="screen screen-final">
  <div class="screen-bg">
    <img src="img/09-bouquet_clean.jpg" alt="">
  </div>
  <div class="screen-content">
    <p class="final-text">旧喜成真</p>
    <span class="final-name">罗 洋</span>
  </div>
</section>

</body>
</html>
