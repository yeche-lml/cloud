<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>八年辗转 · 旧喜成真</title>
<style>
  @import url('https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: "Noto Serif SC", "PingFang SC", "STSong", "SimSun", serif;
    color: #3a3633;
    background: #faf7f3;
    overflow-x: hidden;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* CSS gradients for each screen — floral tones */
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  /* Overlay for text readability */
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(20, 15, 10, 0.35) 0%,
      rgba(20, 15, 10, 0.05) 35%,
      rgba(20, 15, 10, 0.02) 50%,
      rgba(20, 15, 10, 0.05) 65%,
      rgba(20, 15, 10, 0.35) 100%
    );
    pointer-events: none;
  }

  /* Screen-specific backgrounds via data-bg */
  .screen[data-bg="rose"]::before {
    background: linear-gradient(135deg, #f5ebe0 0%, #eed6cc 25%, #f0ddd5 50%, #e8d5c8 75%, #f5ebe0 100%);
  }
  .screen[data-bg="peony"]::before {
    background: linear-gradient(160deg, #faf0e6 0%, #f5e6d8 30%, #eed9c4 60%, #f8eadc 100%);
  }
  .screen[data-bg="tulip"]::before {
    background: linear-gradient(145deg, #f7f2eb 0%, #e8f0e8 30%, #eaf2ee 60%, #f5f0e8 100%);
  }
  .screen[data-bg="gypsophila"]::before {
    background: linear-gradient(150deg, #f6f2f0 0%, #ece8f0 30%, #f0edf5 55%, #f8f5f2 100%);
  }
  .screen[data-bg="daisy"]::before {
    background: linear-gradient(135deg, #faf5ed 0%, #f0e8da 30%, #f5ece0 60%, #faf5ed 100%);
  }
  .screen[data-bg="ranunculus"]::before {
    background: linear-gradient(155deg, #f9f0e8 0%, #f0ddd0 25%, #f5e4d8 55%, #f9f0e8 100%);
  }
  .screen[data-bg="anemone"]::before {
    background: linear-gradient(140deg, #f8f0ee 0%, #eedae4 30%, #f2e2e8 55%, #f8f0ee 100%);
  }
  .screen[data-bg="pink-rose"]::before {
    background: linear-gradient(150deg, #f7ece8 0%, #edddda 30%, #f2e3e0 55%, #f7ece8 100%);
  }
  .screen[data-bg="bouquet"]::before {
    background: radial-gradient(ellipse at 50% 40%, #f8ede4 0%, #f0dcd0 35%, #e8cfc0 70%, #f5e5da 100%);
  }

  /* Subtle noise texture overlay on all screens */
  .screen .noise {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
  }

  .screen-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  /* First screen */
  .screen-hero .title {
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.25);
    line-height: 1.3;
    animation: fadeUp 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Year screens */
  .screen-year .year-num {
    font-size: clamp(6rem, 15vw, 13rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.25);
    line-height: 1;
  }

  /* Final screen */
  .screen-final .final-text {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.25);
    line-height: 1.5;
  }

  .screen-final .final-name {
    display: block;
    margin-top: 1.5rem;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: rgba(250, 247, 243, 0.75);
    text-shadow: 0 1px 20px rgba(0,0,0,0.15);
  }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeInHint 2s 2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }

  @keyframes fadeInHint {
    from { opacity: 0; }
    to   { opacity: 0.5; }
  }

  .scroll-hint span {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(250,247,243,0.55);
  }

  .scroll-line {
    width: 1px;
    height: 3rem;
    background: linear-gradient(to bottom, rgba(250,247,243,0.5), rgba(250,247,243,0));
  }

  @media (max-width: 640px) {
    .screen-hero .title { letter-spacing: 0.1em; }
    .screen-year .year-num { font-size: clamp(4rem, 25vw, 10rem); }
    .screen-final .final-text { letter-spacing: 0.08em; }
    .scroll-hint { bottom: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen-hero .title, .scroll-hint { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<!-- Screen 1: 八年辗转 -->
<section class="screen screen-hero" data-bg="rose">
  <div class="noise"></div>
  <div class="screen-content">
    <h1 class="title">八年辗转</h1>
  </div>
  <div class="scroll-hint">
    <span>向下</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- Screen 2: 2019 -->
<section class="screen screen-year" data-bg="peony">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2019</p>
  </div>
</section>

<!-- Screen 3: 2020 -->
<section class="screen screen-year" data-bg="tulip">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2020</p>
  </div>
</section>

<!-- Screen 4: 2021 -->
<section class="screen screen-year" data-bg="gypsophila">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2021</p>
  </div>
</section>

<!-- Screen 5: 2022 -->
<section class="screen screen-year" data-bg="daisy">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2022</p>
  </div>
</section>

<!-- Screen 6: 2023 -->
<section class="screen screen-year" data-bg="ranunculus">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2023</p>
  </div>
</section>

<!-- Screen 7: 2024 -->
<section class="screen screen-year" data-bg="anemone">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2024</p>
  </div>
</section>

<!-- Screen 8: 2025 -->
<section class="screen screen-year" data-bg="pink-rose">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="year-num">2025</p>
  </div>
</section>

<!-- Screen 9: 旧喜成真 -->
<section class="screen screen-final" data-bg="bouquet">
  <div class="noise"></div>
  <div class="screen-content">
    <p class="final-text">旧喜成真</p>
    <span class="final-name">罗 洋</span>
  </div>
</section>

</body>
</html>
