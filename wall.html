<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>八年辗转 · 旧喜成真</title>
<style>
  @import url('https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: "Noto Serif SC", "PingFang SC", "STSong", "SimSun", serif;
    color: #3a3633;
    background: #faf7f3;
    overflow-x: hidden;
  }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .screen-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .screen-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .screen-bg img.loaded {
    opacity: 1;
  }

  /* Gradient overlay: darker top & bottom, lighter middle for text */
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(20, 15, 10, 0.45) 0%,
      rgba(20, 15, 10, 0.08) 35%,
      rgba(20, 15, 10, 0.04) 50%,
      rgba(20, 15, 10, 0.08) 65%,
      rgba(20, 15, 10, 0.45) 100%
    );
    pointer-events: none;
  }

  .screen-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  /* First screen: big text */
  .screen-hero .title {
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1.3;
    animation: fadeUp 1.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Year screens: just the number */
  .screen-year .year-num {
    font-size: clamp(6rem, 15vw, 13rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1;
  }

  /* Final screen */
  .screen-final .final-text {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: #faf7f3;
    text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    line-height: 1.5;
  }

  .screen-final .final-name {
    display: block;
    margin-top: 1.5rem;
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: rgba(250, 247, 243, 0.75);
    text-shadow: 0 1px 20px rgba(0,0,0,0.2);
  }

  /* Scroll hint on first screen only */
  .scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeInHint 2s 2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }

  @keyframes fadeInHint {
    from { opacity: 0; }
    to   { opacity: 0.55; }
  }

  .scroll-hint span {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(250,247,243,0.6);
  }

  .scroll-line {
    width: 1px;
    height: 3rem;
    background: linear-gradient(to bottom, rgba(250,247,243,0.5), rgba(250,247,243,0));
  }

  /* Responsive */
  @media (max-width: 640px) {
    .screen-hero .title {
      letter-spacing: 0.1em;
    }
    .screen-year .year-num {
      font-size: clamp(4rem, 25vw, 10rem);
    }
    .screen-final .final-text {
      letter-spacing: 0.08em;
    }
    .scroll-hint { bottom: 2rem; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .screen-hero .title,
    .scroll-hint { animation: none; opacity: 1; }
    .screen-bg img { transition: none; }
  }
</style>
</head>
<body>

<!-- Screen 1: 八年辗转 — white rose, soft -->
<section class="screen screen-hero">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?white-rose,cream,flower,soft"
      alt=""
    >
  </div>
  <div class="screen-content">
    <h1 class="title">八年辗转</h1>
  </div>
  <div class="scroll-hint">
    <span>向下</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- Screen 2: 2019 — cream peony -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?cream-peony,flower,soft,bloom"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2019</p>
  </div>
</section>

<!-- Screen 3: 2020 — white tulip -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?white-tulip,soft,pastel,flower"
      alt=""
    >

  <div class="screen-content">

  </div>

<section class="screen screen-year">

      data-src="https://source.unsplash.com/1920x1080/?gypsophila,babys-breath,white,flower"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2021</p>
  </div>

<!-- Screen 5: 2022 — white daisy -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?white-daisy,flower,soft,cream"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2022</p>
  </div>
</section>

<!-- Screen 6: 2023 — cream ranunculus -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?cream-ranunculus,flower,soft,bloom"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2023</p>
  </div>

<!-- Screen 7: 2024 — white anemone -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?white-anemone,flower,soft,pastel"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2024</p>
  </div>
</section>

<!-- Screen 8: 2025 — pink cream rose -->
<section class="screen screen-year">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?pink-rose,cream,flower,soft"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="year-num">2025</p>
  </div>
</section>

<!-- Screen 9: 旧喜成真 — flower bouquet -->
<section class="screen screen-final">
  <div class="screen-bg">
    <img
      data-src="https://source.unsplash.com/1920x1080/?bouquet,cream,white,pink,flower"
      alt=""
    >
  </div>
  <div class="screen-content">
    <p class="final-text">旧喜成真</p>
    <span class="final-name">罗 洋</span>
  </div>
</section>

<script>
(function() {
  const images = document.querySelectorAll('.screen-bg img');

  const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      const img = entry.target;
      const src = img.getAttribute('data-src');
      if (!src) return;

      img.onload = function() {
        img.classList.add('loaded');
      };
      img.onerror = function() {
        // Fallback: generic flower search
        img.src = 'https://source.unsplash.com/1920x1080/?flower,cream,white,soft,pastel';
      };
      img.src = src;
      observer.unobserve(img);
    });
  }, {
    rootMargin: '100vh 0px'
  });

  images.forEach(function(img) {
    observer.observe(img);
  });

  // Preload first two screens immediately
  var preload = images[0];
  if (preload) {
    preload.src = preload.getAttribute('data-src');
    preload.onload = function() { preload.classList.add('loaded'); };
  }
})();
</script>

</body>
</html>
