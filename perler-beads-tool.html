<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆图纸工具</title>
<style>
:root {
  --bg: #f0f0f0;
  --panel-bg: #f8f8f8;
  --border: #d0d0d0;
  --grid-border: #ccc;
  --cell-border: #e0e0e0;
  --text: #333;
  --text-light: #666;
  --cell-size: 24px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* Header */
.header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #333;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #888;
}

/* Main Layout */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar-section {
  padding: 10px 12px;
  border-bottom: 1px solid #eee;
}
.sidebar-section h3 {
  font-size: 12px;
  font-weight: 600;
  color: #888;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Current color display */
.current-color-display {
  display: flex;
  align-items: center;
  gap: 10px;
}
.color-preview {
  width: 40px; height: 40px;
  border-radius: 4px;
  border: 2px solid #ccc;
  background-image: linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0),
                    linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0);
  background-size: 10px 10px;
  background-position: 0 0, 5px 5px;
}
.color-preview-inner {
  width: 100%; height: 100%;
  border-radius: 2px;
}
.color-code-label {
  font-size: 14px;
  font-weight: 600;
}
.eraser-indicator {
  font-size: 13px;
  color: #f44336;
}

/* Color grid palette */
.color-palette {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  max-height: 200px;
  overflow-y: auto;
}
.color-swatch {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 3px;
  cursor: pointer;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 600;
  transition: border-color 0.15s;
}
.color-swatch:hover { border-color: #999; }
.color-swatch.selected { border-color: #333; box-shadow: 0 0 0 1px #fff inset; }

/* Buttons */
.btn {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 5px;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  margin-bottom: 6px;
  transition: background 0.15s, border-color 0.15s;
  font-family: inherit;
}
.btn:hover { background: #f5f5f5; border-color: #bbb; }
.btn-primary { background: #333; color: #fff; border-color: #333; }
.btn-primary:hover { background: #555; border-color: #555; }
.btn-danger { background: #fff; color: #e53935; border-color: #e53935; }
.btn-danger:hover { background: #ffebee; }
.btn-small {
  padding: 5px 10px;
  font-size: 12px;
  margin-bottom: 3px;
}
.btn-group {
  display: flex;
  gap: 4px;
}
.btn-group .btn { flex: 1; }

/* Canvas area */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 20px;
}
.canvas-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.column-numbers-top, .column-numbers-bottom {
  display: flex;
  padding-left: 30px; /* space for row numbers */
}
.column-numbers-top span, .column-numbers-bottom span {
  width: var(--cell-size);
  text-align: center;
  font-size: 10px;
  color: #999;
  flex-shrink: 0;
}
.grid-with-rows {
  display: flex;
}
.row-numbers {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.row-numbers span {
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  font-size: 10px;
  color: #999;
  padding-right: 4px;
  width: 26px;
  flex-shrink: 0;
}
.canvas-grid {
  display: flex;
  flex-direction: column;
  border: 1px solid #aaa;
}
.grid-row {
  display: flex;
}
.grid-cell {
  width: var(--cell-size);
  height: var(--cell-size);
  border: 1px solid var(--cell-border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 600;
  text-align: center;
  line-height: 1;
  transition: background 0.1s;
  position: relative;
  flex-shrink: 0;
}
.grid-cell.empty {
  background-image: linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%, #e6e6e6),
                    linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%, #e6e6e6);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
  background-color: #fff;
}
.grid-cell.filled {
  border-color: rgba(0,0,0,0.15);
}

/* Stats Bar */
.stats-bar {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  flex-shrink: 0;
  min-height: 56px;
  flex-wrap: wrap;
}
.stats-item {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  border-radius: 4px;
  background: #f8f8f8;
  border: 1px solid #eee;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s;
}
.stats-item:hover { background: #efefef; }
.stats-color {
  width: 16px; height: 16px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.1);
  flex-shrink: 0;
}
.stats-count { color: #888; font-weight: 500; }
.stats-empty {
  font-size: 12px;
  color: #bbb;
  padding: 4px 8px;
}

/* Footer */
.footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 4px 16px;
  background: #fff;
  border-top: 1px solid #eee;
  font-size: 11px;
  color: #aaa;
  flex-shrink: 0;
}
.footer-brand {
  display: flex;
  align-items: center;
  gap: 4px;
}
.footer-star {
  color: #f5a623;
  font-size: 14px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

/* Template Section */
.template-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 10px 12px;
  border-bottom: 1px solid #eee;
}
.template-toggle h3 {
  font-size: 12px;
  font-weight: 600;
  color: #888;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.template-toggle .arrow {
  font-size: 10px;
  color: #999;
  transition: transform 0.2s;
}
.template-toggle.collapsed .arrow {
  transform: rotate(-90deg);
}
.template-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  padding: 6px 10px 10px;
  border-bottom: 1px solid #eee;
}
.template-grid.collapsed { display: none; }
.template-item {
  cursor: pointer;
  border-radius: 4px;
  border: 2px solid transparent;
  padding: 4px;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.template-item:hover {
  border-color: #999;
  background: #f5f5f5;
}
.template-thumb {
  display: grid;
  margin: 0 auto;
  gap: 1px;
}
.template-thumb-cell {
  width: 100%;
  aspect-ratio: 1;
}
.template-label {
  font-size: 10px;
  color: #666;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Responsive cell size */
@media (max-width: 1200px) {
  :root { --cell-size: 18px; }
  .grid-cell { font-size: 6px; }
}
@media (max-width: 900px) {
  :root { --cell-size: 14px; }
  .grid-cell { font-size: 5px; }
  .sidebar { width: 170px; }
}
</style>
</head>

<footer class="footer">

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r:0,g:0,b:0 };
}

function getTextColor(bgHex) {
  const {r,g,b} = hexToRgb(bgHex);
  const luminance = 0.299*r + 0.587*g + 0.114*b;
  return luminance > 150 ? '#000' : '#fff';
}

// ============ State ============
let canvasSize = 40;
let grid = []; // grid[row][col] = colorCode or null
let currentColor = null;
let isEraser = false;
let mouseDown = false;

// ============ DOM Refs ============
const canvasWrapper = document.getElementById('canvasWrapper');
const statsBar = document.getElementById('statsBar');
const currentColorLabel = document.getElementById('currentColorLabel');
const currentColorInner = document.getElementById('currentColorInner');
const currentColorPreview = document.getElementById('currentColorPreview');
const eraserIndicator = document.getElementById('eraserIndicator');
const canvasSizeLabel = document.getElementById('canvasSizeLabel');
const filledCountEl = document.getElementById('filledCount');
const colorPaletteContainer = document.getElementById('colorPaletteContainer');

// ============ Initialize ============
function initGrid() {
  grid = Array.from({length: canvasSize}, () => Array(canvasSize).fill(null));
}

function renderAll() {
  renderCanvas();
  renderStats();
  renderPalette();
  updateCurrentColorDisplay();
  canvasSizeLabel.textContent = `${canvasSize}×${canvasSize}`;
}

function renderCanvas() {
  const cs = getComputedStyle(document.documentElement).getPropertyValue('--cell-size').trim();
  const cellSizePx = parseInt(cs);

  let html = '';

  // Top column numbers
  html += '<div class="column-numbers-top">';
  for (let c = 1; c <= canvasSize; c++) html += `<span>${c}</span>`;
  html += '</div>';

  // Grid with row numbers
  html += '<div class="grid-with-rows">';
  html += '<div class="row-numbers">';
  for (let r = 1; r <= canvasSize; r++) html += `<span>${r}</span>`;
  html += '</div>';

  html += '<div class="canvas-grid">';
  for (let r = 0; r < canvasSize; r++) {
    html += '<div class="grid-row">';
    for (let c = 0; c < canvasSize; c++) {
      const code = grid[r][c];
      if (code) {
        const hex = COLOR_MAP[code] ? COLOR_MAP[code].hex : '#ccc';
        const txtColor = getTextColor(hex);
        html += `<div class="grid-cell filled" data-row="${r}" data-col="${c}" style="background:${hex};color:${txtColor}">${code}</div>`;
      } else {
        html += `<div class="grid-cell empty" data-row="${r}" data-col="${c}"></div>`;
      }
    }
    html += '</div>';
  }
  html += '</div></div>';

  // Bottom column numbers
  html += '<div class="column-numbers-bottom">';
  for (let c = 1; c <= canvasSize; c++) html += `<span>${c}</span>`;
  html += '</div>';

  canvasWrapper.innerHTML = html;

  // Attach cell events
  const cells = canvasWrapper.querySelectorAll('.grid-cell');
  cells.forEach(cell => {
    cell.addEventListener('mousedown', onCellMouseDown);
    cell.addEventListener('mouseenter', onCellMouseEnter);
  });
}

document.addEventListener('mouseup', () => { mouseDown = false; });

function onCellMouseDown(e) {
  mouseDown = true;
  const row = parseInt(e.currentTarget.dataset.row);
  const col = parseInt(e.currentTarget.dataset.col);
  paintCell(row, col);
}

function onCellMouseEnter(e) {
  if (!mouseDown) return;
  const row = parseInt(e.currentTarget.dataset.row);
  const col = parseInt(e.currentTarget.dataset.col);
  paintCell(row, col);
}

function paintCell(row, col) {
  if (isEraser) {
    grid[row][col] = null;
  } else if (currentColor) {
    grid[row][col] = currentColor;
  }
  // re-render just this cell for performance
  updateCell(row, col);
  renderStatsQuick();
}

function updateCell(row, col) {
  const cell = canvasWrapper.querySelector(`.grid-cell[data-row="${row}"][data-col="${col}"]`);
  if (!cell) return;
  const code = grid[row][col];
  cell.className = 'grid-cell';
  if (code) {
    const hex = COLOR_MAP[code] ? COLOR_MAP[code].hex : '#ccc';
    cell.classList.add('filled');
    cell.style.background = hex;
    cell.style.color = getTextColor(hex);
    cell.textContent = code;
  } else {
    cell.classList.add('empty');
    cell.style.background = '';
    cell.style.color = '';
    cell.textContent = '';
  }
}

function renderStatsQuick() {
  // Update stats without full rebuild of canvas
  const stats = computeStats();
  renderStatsBarFromStats(stats);
  filledCountEl.textContent = `${stats.totalFilled} 格已填充`;
}

function computeStats() {
  const countMap = {};
  for (let r = 0; r < canvasSize; r++) {
    for (let c = 0; c < canvasSize; c++) {
      const code = grid[r][c];
      if (code) countMap[code] = (countMap[code] || 0) + 1;
    }
  }
  const entries = Object.entries(countMap).sort((a,b) => b[1] - a[1]);
  const totalFilled = entries.reduce((sum, [_, n]) => sum + n, 0);
  return { entries, totalFilled };
}

function renderStats() {
  const stats = computeStats();
  renderStatsBarFromStats(stats);
  filledCountEl.textContent = `${stats.totalFilled} 格已填充`;
}

function renderStatsBarFromStats(stats) {
  if (stats.entries.length === 0) {
    statsBar.innerHTML = '<span class="stats-empty">画布为空，请选择颜色开始绘制</span>';
    return;
  }
  statsBar.innerHTML = stats.entries.map(([code, count]) => {
    const info = COLOR_MAP[code];
    const hex = info ? info.hex : '#ccc';
    return `<div class="stats-item" data-code="${code}" title="点击选择 ${code}">
      <div class="stats-color" style="background:${hex}"></div>
      <span>${code}</span>
      <span class="stats-count">× ${count}</span>
    </div>`;
  }).join('');

  // Click on stats item selects that color
  statsBar.querySelectorAll('.stats-item').forEach(item => {
    item.addEventListener('click', () => {
      const code = item.dataset.code;
      selectColor(code);
    });
  });
}

function selectColor(code) {
  isEraser = false;
  currentColor = code;
  updateCurrentColorDisplay();
  renderPaletteSelection();
}

function updateCurrentColorDisplay() {
  if (isEraser) {
    currentColorInner.style.background = '';
    currentColorLabel.textContent = '橡皮擦';
    eraserIndicator.style.display = 'block';
  } else if (currentColor && COLOR_MAP[currentColor]) {
    currentColorInner.style.background = COLOR_MAP[currentColor].hex;
    currentColorLabel.textContent = currentColor;
    eraserIndicator.style.display = 'none';
  } else {
    currentColorInner.style.background = '';
    currentColorLabel.textContent = '无';
    eraserIndicator.style.display = 'none';
  }
}

// ============ Color Palette ============
function renderPalette() {
  let html = '';
  for (const [series, data] of Object.entries(MARD_COLORS)) {
    html += `<div class="sidebar-section">`;
    html += `<h3>${series}系列 · ${data.name} (${data.colors.length}色)</h3>`;
    html += `<div class="color-palette" data-series="${series}">`;
    for (const [code, hex] of data.colors) {
      const txtColor = getTextColor(hex);
      const selectedClass = (currentColor === code && !isEraser) ? ' selected' : '';
      html += `<div class="color-swatch${selectedClass}" data-code="${code}" style="background:${hex};color:${txtColor}" title="${code}">${code}</div>`;
    }
    html += `</div></div>`;
  }
  colorPaletteContainer.innerHTML = html;

  // Attach click events
  colorPaletteContainer.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', () => {
      selectColor(swatch.dataset.code);
    });
  });
}

function renderPaletteSelection() {
  colorPaletteContainer.querySelectorAll('.color-swatch').forEach(swatch => {
    if (swatch.dataset.code === currentColor && !isEraser) {
      swatch.classList.add('selected');
    } else {
      swatch.classList.remove('selected');
    }
  });
}

// ============ Buttons ============
document.getElementById('btnSelectEraser').addEventListener('click', () => {
  isEraser = true;
  currentColor = null;
  updateCurrentColorDisplay();
  renderPaletteSelection();
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (confirm('确定要清空整个画布吗？此操作不可撤销。')) {
    initGrid();
    renderAll();
  }
});

document.querySelectorAll('[data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    const newSize = parseInt(btn.dataset.size);
    if (newSize === canvasSize) return;
    if (confirm(`切换画布尺寸为 ${newSize}×${newSize} 将清空当前画布，确定吗？`)) {
      canvasSize = newSize;
      initGrid();
      renderAll();
      // Update size buttons
      document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('btn-primary'));
      btn.classList.add('btn-primary');
    }
  });
});

// ============ Import Image ============
document.getElementById('btnImportImage').addEventListener('click', () => {
  document.getElementById('imageInput').click();
});

document.getElementById('imageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  try {
    const img = await loadImage(file);
    const pattern = convertImageToPattern(img, canvasSize);
    
    // Match colors
    const allColorCodes = Object.keys(COLOR_MAP);
    for (let r = 0; r < canvasSize; r++) {
      for (let c = 0; c < canvasSize; c++) {
        const pixelColor = pattern[r][c];
        if (pixelColor) {
          grid[r][c] = findClosestColor(pixelColor, allColorCodes);
        }
      }
    }
    
    renderAll();
  } catch (err) {
    alert('图片导入失败: ' + err.message);
  }
  
  // Reset input
  e.target.value = '';
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片加载失败'));
    img.src = URL.createObjectURL(file);
  });
}

function convertImageToPattern(img, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  // Pixelate using nearest-neighbor
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, size, size);
  
  const imageData = ctx.getImageData(0, 0, size, size);
  const pattern = [];
  for (let r = 0; r < size; r++) {
    pattern[r] = [];
    for (let c = 0; c < size; c++) {
      const idx = (r * size + c) * 4;
      const red = imageData.data[idx];
      const green = imageData.data[idx + 1];
      const blue = imageData.data[idx + 2];
      const alpha = imageData.data[idx + 3];
      
      // Skip transparent pixels
      if (alpha < 128) {
        pattern[r][c] = null;
      } else {
        pattern[r][c] = { r: red, g: green, b: blue };
      }
    }
  }
  return pattern;
}

function findClosestColor(pixelColor, colorCodes) {
  let bestCode = colorCodes[0];
  let bestDist = Infinity;
  
  for (const code of colorCodes) {
    const target = COLOR_MAP[code].rgb;
    const dr = pixelColor.r - target.r;
    const dg = pixelColor.g - target.g;
    const db = pixelColor.b - target.b;
    // Weighted Euclidean distance (human perception weights)
    const dist = 2*dr*dr + 4*dg*dg + 3*db*db;
    if (dist < bestDist) {
      bestDist = dist;
      bestCode = code;
    }
  }
  return bestCode;
}

// ============ Export ============
document.getElementById('btnExport').addEventListener('click', () => {
  const stats = computeStats();
  if (stats.totalFilled === 0) {
    alert('画布为空，请先绘制图案再导出');
    return;
  }
  
  const cs = getComputedStyle(document.documentElement).getPropertyValue('--cell-size').trim();
  const cellPx = parseInt(cs);
  const padding = 40;
  const headerHeight = 20;
  const legendHeight = 80;
  
  const w = canvasSize * cellPx + padding * 2;
  const h = canvasSize * cellPx + padding * 2 + headerHeight * 2 + legendHeight;
  
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = w;
  exportCanvas.height = h;
  const ctx = exportCanvas.getContext('2d');
  
  // Background white
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  
  // Grid offset
  const gx = padding;
  const gy = padding + headerHeight;
  
  // Column numbers top
  ctx.fillStyle = '#999';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  for (let c = 1; c <= canvasSize; c++) {
    ctx.fillText(c, gx + (c - 0.5) * cellPx, gy - 6);
  }
  
  // Row numbers
  ctx.textAlign = 'right';
  for (let r = 1; r <= canvasSize; r++) {
    ctx.fillText(r, gx - 4, gy + (r - 0.5) * cellPx + 3);
  }
  
  // Draw cells
  for (let r = 0; r < canvasSize; r++) {
    for (let c = 0; c < canvasSize; c++) {
      const x = gx + c * cellPx;
      const y = gy + r * cellPx;
      const code = grid[r][c];
      
      if (code && COLOR_MAP[code]) {
        ctx.fillStyle = COLOR_MAP[code].hex;
        ctx.fillRect(x, y, cellPx, cellPx);
        
        ctx.fillStyle = getTextColor(COLOR_MAP[code].hex);
        ctx.font = `bold ${Math.max(7, cellPx * 0.35)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(code, x + cellPx/2, y + cellPx/2);
      } else {
        // Checkerboard pattern
        const isEven = (r + c) % 2 === 0;
        ctx.fillStyle = isEven ? '#f0f0f0' : '#ffffff';
        ctx.fillRect(x, y, cellPx, cellPx);
      }
      
      // Cell border
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, cellPx, cellPx);
    }
  }
  
  // Grid outer border
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx, gy, canvasSize * cellPx, canvasSize * cellPx);
  
  // Bottom column numbers
  const bottomY = gy + canvasSize * cellPx + 4;
  ctx.fillStyle = '#999';
  ctx.textAlign = 'center';
  for (let c = 1; c <= canvasSize; c++) {
    ctx.fillText(c, gx + (c - 0.5) * cellPx, bottomY + 10);
  }
  
  // Legend
  const legendY = bottomY + 20;
  ctx.fillStyle = '#333';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('颜色统计', gx, legendY);
  
  let lx = gx;
  let ly = legendY + 16;
  const swatchSize = 14;
  const statsEntries = stats.entries.slice(0, 60); // max 60 items in legend
  
  for (let i = 0; i < statsEntries.length; i++) {
    const [code, count] = statsEntries[i];
    const hex = COLOR_MAP[code] ? COLOR_MAP[code].hex : '#ccc';
    
    if (lx + 68 > w - padding) {
      lx = gx;
      ly += 22;
    }
    
    ctx.fillStyle = hex;
    ctx.fillRect(lx, ly, swatchSize, swatchSize);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(lx, ly, swatchSize, swatchSize);
    
    ctx.fillStyle = '#333';
    ctx.font = '9px sans-serif';
    ctx.fillText(`${code} ×${count}`, lx + swatchSize + 3, ly + 11);
    
    lx += 68;
  }
  
  // Brand
  ctx.fillStyle = '#aaa';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('★ 小目拼豆', w - padding, h - 10);
  
  // Download
  exportCanvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `perler-beads-pattern-${canvasSize}x${canvasSize}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
});

// ============ Keyboard shortcuts ============
document.addEventListener('keydown', (e) => {
  if (e.key === 'e' && !e.ctrlKey && !e.metaKey && !e.target.closest('input,textarea')) {
    isEraser = true;
    currentColor = null;
    updateCurrentColorDisplay();
    renderPaletteSelection();
  }
});

// ============ Templates ============
const templateGrid = document.getElementById('templateGrid');
const templateToggle = document.getElementById('templateToggle');
let templatesExpanded = true;

function renderTemplates() {
  templateGrid.innerHTML = '';
  TEMPLATES.forEach((tmpl, idx) => {
    const maxThumbSize = 72;
    const cellPx = Math.floor(maxThumbSize / tmpl.size);
    const actualSize = cellPx * tmpl.size;
    
    const item = document.createElement('div');
    item.className = 'template-item';
    item.title = `点击加载「${tmpl.name}」模板`;
    
    let thumbHTML = `<div class="template-thumb" style="width:${actualSize}px;grid-template-columns:repeat(${tmpl.size},${cellPx}px);">`;
    for (let r = 0; r < tmpl.size; r++) {
      for (let c = 0; c < tmpl.size; c++) {
        const code = tmpl.data[r][c];
        if (code && COLOR_MAP[code]) {
          thumbHTML += `<div class="template-thumb-cell" style="background:${COLOR_MAP[code].hex};width:${cellPx}px;height:${cellPx}px;"></div>`;
        } else {
          const isEven = (r + c) % 2 === 0;
          thumbHTML += `<div class="template-thumb-cell" style="background:${isEven ? '#f0f0f0' : '#fff'};width:${cellPx}px;height:${cellPx}px;"></div>`;
        }
      }
    }
    thumbHTML += '</div>';
    
    item.innerHTML = thumbHTML + `<div class="template-label">${tmpl.name} ${tmpl.size}×${tmpl.size}</div>`;
    
    item.addEventListener('click', () => loadTemplate(idx));
    templateGrid.appendChild(item);
  });
}

function loadTemplate(idx) {
  const tmpl = TEMPLATES[idx];
  if (!tmpl) return;
  
  // Switch canvas size if needed
  if (canvasSize !== tmpl.size) {
    canvasSize = tmpl.size;
    initGrid();
    document.querySelectorAll('[data-size]').forEach(b => {
      b.classList.remove('btn-primary');
      if (parseInt(b.dataset.size) === tmpl.size) b.classList.add('btn-primary');
    });
  } else {
    initGrid();
  }
  
  // Copy template data to grid
  for (let r = 0; r < tmpl.size; r++) {
    for (let c = 0; c < tmpl.size; c++) {
      grid[r][c] = tmpl.data[r][c];
    }
  }
  
  renderAll();
  
  // Highlight matched size button
  document.querySelectorAll('[data-size]').forEach(b => {
    b.classList.remove('btn-primary');
    if (parseInt(b.dataset.size) === tmpl.size) b.classList.add('btn-primary');
  });
}

// Toggle collapse
templateToggle.addEventListener('click', () => {
  templatesExpanded = !templatesExpanded;
  if (templatesExpanded) {
    templateToggle.classList.remove('collapsed');
    templateGrid.classList.remove('collapsed');
  } else {
    templateToggle.classList.add('collapsed');
    templateGrid.classList.add('collapsed');
  }
});

// ============ Initialize ============
initGrid();
renderAll();
renderTemplates();

// Set first swatch as default
const firstSwatch = document.querySelector('.color-swatch');
if (firstSwatch) {
  selectColor(firstSwatch.dataset.code);
}
</script>
